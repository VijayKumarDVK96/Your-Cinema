##################################################
# Your Cinema - Docker Compose
#
# Joins the existing PostgreSQL network:
#   postgresql_postgres_network
#
# Services:
#   your-cinema-backend   port 5000
#   your-cinema-frontend  port 3000 (nginx)
##################################################

version: '3.8'

services:

  # ---------------------------------------------
  # Backend - Node.js / Express API
  # ---------------------------------------------
  backend:
    container_name: your-cinema-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: your-cinema-backend:latest
    restart: unless-stopped

    env_file:
      - ./backend/.env          # NOT committed to git - generated by Jenkins

    environment:
      NODE_ENV: production
      # Override DB host to point to the containerised postgres service name
      DB_HOST: postgres
      DB_PORT: "5432"
      CLIENT_URL: http://vijayott.duckdns.org

    ports:
      - "5000:5000"

    networks:
      - postgres_network         # shared with the existing postgres container

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      - wait-for-postgres

  # ---------------------------------------------
  # Wait-for-postgres helper (ensures PG is ready
  # before backend starts running migrations)
  # ---------------------------------------------
  wait-for-postgres:
    image: postgres:16-alpine
    container_name: your-cinema-wait-postgres
    entrypoint: >
      sh -c "
        until pg_isready -h postgres -p 5432; do
          echo 'Waiting for PostgreSQL...';
          sleep 2;
        done;
        echo 'PostgreSQL is ready.';
      "
    networks:
      - postgres_network
    restart: "no"

  # ---------------------------------------------
  # Frontend - React (Vite build) served by Nginx
  # ---------------------------------------------
  frontend:
    container_name: your-cinema-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: http://your-cinema-backend:5000
    image: your-cinema-frontend:latest
    restart: unless-stopped

    ports:
      - "3000:80"

    networks:
      - postgres_network

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    depends_on:
      - backend

##################################################
# Networks
##################################################
networks:
  postgres_network:
    external: true
    name: postgresql_postgres_network